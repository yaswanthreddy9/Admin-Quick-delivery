<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#111;color:white;padding:15px;display:flex;gap:10px}

/* MENU */
.menu{
position:fixed;left:-250px;top:0;width:250px;height:100%;
background:white;transition:0.3s;z-index:1000;
}
.menu.open{left:0}

.menu-item{padding:15px;border-bottom:1px solid #eee;cursor:pointer}

#overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.4);display:none;
}

/* CONTAINER */
.container{padding:15px}

/* CARD */
.card{
background:white;padding:15px;margin:10px 0;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* INPUT */
input{
width:100%;padding:10px;margin:5px 0;
border-radius:6px;border:1px solid #ccc;
}

button{
padding:8px;border:none;border-radius:6px;
background:#16a34a;color:white;cursor:pointer;margin:2px;
}
.delete{background:red}
.edit{background:orange}
</style>
</head>

<body>

<header>
<span onclick="openMenu()">☰</span>
Admin Panel
</header>

<div id="overlay" onclick="closeMenu()"></div>

<div id="menu" class="menu">
<div class="menu-item" onclick="showItems()">🍗 Items</div>
<div class="menu-item" onclick="logout()">🚪 Logout</div>
</div>

<div class="container">

<h3>Add / Edit Item</h3>

<input id="name" placeholder="Item Name">
<input id="price" type="number" placeholder="Price">
<input id="image" placeholder="Image URL">

<button onclick="saveItem()">Save Item</button>

<h3>Items</h3>
<div id="itemsList"></div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const ADMIN_EMAIL="myeswanthreddy321@gmail.com";

const config={
apiKey:"AIzaSyD7fBeJ4cV82_7OaWltZ8DDvEr-Y9B_mZA",
authDomain:"chicken-delivery-app-9e4f6.firebaseapp.com",
projectId:"chicken-delivery-app-9e4f6"
};

firebase.initializeApp(config);
const db=firebase.firestore();
const auth=firebase.auth();

let currentUser=null;
let editId=null;

/* AUTH */
auth.onAuthStateChanged(user=>{
currentUser=user;

if(!user){
googleLogin();
return;
}

if(user.email!==ADMIN_EMAIL){
alert("Not admin");
auth.signOut();
}
});

/* GOOGLE LOGIN */
function googleLogin(){
const provider=new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider).catch(err=>alert(err.message));
}

/* LOGOUT */
function logout(){auth.signOut();}

/* MENU */
function openMenu(){
menu.classList.add("open");
overlay.style.display="block";
}
function closeMenu(){
menu.classList.remove("open");
overlay.style.display="none";
}

/* SAVE ITEM (ADD + EDIT) */
function saveItem(){

if(!currentUser){
alert("Login required");
return;
}

if(!name.value || !price.value){
alert("Fill all fields");
return;
}

let data={
name:name.value,
price:Number(price.value),
image:image.value
};

if(editId){
db.collection("items").doc(editId).update(data)
.then(()=>alert("Updated"))
.catch(err=>alert(err.message));
editId=null;
}else{
db.collection("items").add(data)
.then(()=>alert("Added"))
.catch(err=>alert(err.message));
}

name.value="";
price.value="";
image.value="";
}

/* LOAD ITEMS */
db.collection("items").onSnapshot(snap=>{
itemsList.innerHTML="";

snap.forEach(doc=>{
let i=doc.data();

itemsList.innerHTML+=`
<div class="card">
<b>${i.name}</b> - ₹${i.price}<br>

<img src="${i.image}" width="100%"
onerror="this.src='https://via.placeholder.com/150'">

<br>

<button class="edit" onclick="editItem('${doc.id}','${i.name}',${i.price},'${i.image}')">Edit</button>
<button class="delete" onclick="deleteItem('${doc.id}')">Delete</button>
</div>`;
});
});

/* EDIT */
function editItem(id,n,p,img){
editId=id;
name.value=n;
price.value=p;
image.value=img;
window.scrollTo(0,0);
}

/* DELETE */
function deleteItem(id){
if(confirm("Delete item?")){
db.collection("items").doc(id).delete();
}
}

/* DOM */
const menu=document.getElementById("menu");
const overlay=document.getElementById("overlay");
const itemsList=document.getElementById("itemsList");
</script>

</body>
</html>

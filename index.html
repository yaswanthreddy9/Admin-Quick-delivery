<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}

/* HEADER */
header{
background:#111;color:white;padding:15px;
display:flex;align-items:center;gap:10px;
}

/* SIDEBAR */
.menu{
position:fixed;left:-250px;top:0;width:250px;height:100%;
background:white;transition:0.3s;z-index:1000;
}
.menu.open{left:0}

.menu-item{
padding:15px;border-bottom:1px solid #eee;cursor:pointer;
}

/* OVERLAY */
#overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.4);display:none;
}

/* CONTAINER */
.container{padding:15px}

/* CARD */
.card{
background:white;padding:15px;margin:10px 0;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* INPUT */
input{
width:100%;padding:10px;margin:5px 0;
border-radius:6px;border:1px solid #ccc;
}

button{
padding:8px;border:none;border-radius:6px;
background:#16a34a;color:white;cursor:pointer;margin:2px;
}
.delete{background:red}
.edit{background:orange}
</style>
</head>

<body>

<header>
<span onclick="openMenu()">☰</span>
Admin Panel
</header>

<div id="overlay" onclick="closeMenu()"></div>

<!-- MENU -->
<div id="menu" class="menu">
<div class="menu-item" onclick="showDashboard()">📊 Dashboard</div>
<div class="menu-item" onclick="showItems()">🍗 Items</div>
<div class="menu-item" onclick="showOrders()">📦 Orders</div>
<div class="menu-item" onclick="logout()">🚪 Logout</div>
</div>

<div class="container">

<!-- DASHBOARD -->
<div id="dashboardSection">
<h3>Dashboard</h3>
<div id="dashboardData"></div>
</div>

<!-- ITEMS -->
<div id="itemsSection" style="display:none">

<h3>Add / Edit Item</h3>

<input id="nameInput" placeholder="Item Name">
<input id="priceInput" type="number" placeholder="Price">
<input id="imageInput" placeholder="Image URL">

<button onclick="saveItem()">Save Item</button>

<h3>Items</h3>
<div id="itemsList"></div>

</div>

<!-- ORDERS -->
<div id="ordersSection" style="display:none">
<h3>Orders</h3>
<div id="ordersList"></div>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const ADMIN_EMAIL="myeswanthreddy321@gmail.com";

const config={
apiKey:"AIzaSyD7fBeJ4cV82_7OaWltZ8DDvEr-Y9B_mZA",
authDomain:"chicken-delivery-app-9e4f6.firebaseapp.com",
projectId:"chicken-delivery-app-9e4f6"
};

firebase.initializeApp(config);
const db=firebase.firestore();
const auth=firebase.auth();

let currentUser=null;
let editId=null;

/* AUTH */
auth.onAuthStateChanged(user=>{
if(!user){
googleLogin();
return;
}

if(user.email!==ADMIN_EMAIL){
alert("Not authorized");
auth.signOut();
return;
}

currentUser=user;
});

/* GOOGLE LOGIN */
function googleLogin(){
const provider=new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider);
}

/* LOGOUT */
function logout(){auth.signOut();}

/* MENU */
function openMenu(){
menu.classList.add("open");
overlay.style.display="block";
}
function closeMenu(){
menu.classList.remove("open");
overlay.style.display="none";
}

/* NAVIGATION */
function showDashboard(){
dashboardSection.style.display="block";
itemsSection.style.display="none";
ordersSection.style.display="none";
closeMenu();
}
function showItems(){
dashboardSection.style.display="none";
itemsSection.style.display="block";
ordersSection.style.display="none";
closeMenu();
}
function showOrders(){
dashboardSection.style.display="none";
itemsSection.style.display="none";
ordersSection.style.display="block";
closeMenu();
}

/* SAVE ITEM */
function saveItem(){

const name = document.getElementById("nameInput").value.trim();
const price = document.getElementById("priceInput").value.trim();
const image = document.getElementById("imageInput").value.trim();

if(!name || !price){
alert("Fill all fields properly");
return;
}

let data={
name:name,
price:Number(price),
image:image
};

if(editId){
db.collection("items").doc(editId).update(data)
.then(()=>alert("Updated"))
.catch(e=>alert(e.message));
editId=null;
}else{
db.collection("items").add(data)
.then(()=>alert("Added"))
.catch(e=>alert(e.message));
}

/* CLEAR */
document.getElementById("nameInput").value="";
document.getElementById("priceInput").value="";
document.getElementById("imageInput").value="";
}

/* LOAD ITEMS */
db.collection("items").onSnapshot(snap=>{
itemsList.innerHTML="";

snap.forEach(doc=>{
let i=doc.data();

itemsList.innerHTML+=`
<div class="card">
<b>${i.name}</b> - ₹${i.price}<br>

<img src="${i.image}" width="100%"
onerror="this.src='https://via.placeholder.com/150'">

<br>

<button class="edit" onclick="editItem('${doc.id}','${i.name}',${i.price},'${i.image}')">Edit</button>
<button class="delete" onclick="deleteItem('${doc.id}')">Delete</button>
</div>`;
});
});

/* EDIT */
function editItem(id,n,p,img){
editId=id;
document.getElementById("nameInput").value=n;
document.getElementById("priceInput").value=p;
document.getElementById("imageInput").value=img;
window.scrollTo(0,0);
}

/* DELETE */
function deleteItem(id){
if(confirm("Delete item?")){
db.collection("items").doc(id).delete();
}
}

/* LOAD ORDERS */
db.collection("orders").onSnapshot(snap=>{
ordersList.innerHTML="";
let total=0;

snap.forEach(doc=>{
let o=doc.data();
total++;

ordersList.innerHTML+=`
<div class="card">
Order: ${doc.id.slice(0,6)}<br>
Status: ${o.status || "pending"}
</div>`;
});

dashboardData.innerHTML=`
<div class="card">
Total Orders: ${total}
</div>`;
});

/* DOM */
const menu=document.getElementById("menu");
const overlay=document.getElementById("overlay");
const itemsList=document.getElementById("itemsList");
const ordersList=document.getElementById("ordersList");
const dashboardData=document.getElementById("dashboardData");
const dashboardSection=document.getElementById("dashboardSection");
const itemsSection=document.getElementById("itemsSection");
const ordersSection=document.getElementById("ordersSection");
</script>

</body>
</html>

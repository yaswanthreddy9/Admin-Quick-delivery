<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#111;color:white;padding:15px;display:flex;gap:10px}

/* SIDEBAR */
.menu{position:fixed;left:-260px;top:0;width:260px;height:100%;background:white;transition:0.3s;z-index:1000;}
.menu.open{left:0}
.menu-item{padding:15px;border-bottom:1px solid #eee;cursor:pointer}

/* OVERLAY */
#overlay{position:fixed;width:100%;height:100%;background:rgba(0,0,0,0.4);display:none}

/* CONTENT */
.container{padding:15px}

/* CARD */
.card{
background:white;padding:15px;margin:10px 0;
border-radius:10px;cursor:pointer;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
display:flex;justify-content:space-between;align-items:center;
}

/* BUTTON */
button{
padding:6px 10px;border:none;border-radius:6px;
background:#16a34a;color:white;cursor:pointer;
}
.reject{background:red}

/* MODAL */
.modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;justify-content:center;align-items:center;
}
.box{
background:white;padding:20px;border-radius:10px;
width:90%;max-width:400px;
}
</style>
</head>

<body>

<header>
<span onclick="openMenu()">☰</span>
Admin Panel
</header>

<div id="overlay" onclick="closeMenu()"></div>

<!-- SIDEBAR -->
<div id="menu" class="menu">
<div class="menu-item" onclick="showDashboard()">📊 Dashboard</div>
<div class="menu-item" onclick="showDelivery()">🚚 Delivery</div>
<div class="menu-item" onclick="showOrders()">📦 Orders</div>
<div class="menu-item" onclick="logout()">🚪 Logout</div>
</div>

<div class="container">

<!-- DASHBOARD -->
<div id="dashboardSection">
<h3>Active Orders</h3>
<div id="dashboardList"></div>
</div>

<!-- DELIVERY -->
<div id="deliverySection" style="display:none">
<h3>Out for Delivery</h3>
<div id="deliveryList"></div>
</div>

<!-- ORDERS -->
<div id="ordersSection" style="display:none">
<h3>Completed / Rejected</h3>
<div id="ordersList"></div>
</div>

</div>

<!-- ORDER MODAL -->
<div id="orderModal" class="modal">
<div class="box">
<h3>Order Details</h3>
<div id="orderDetails"></div>

<select id="statusSelect">
<option>pending</option>
<option>preparing</option>
<option>out for delivery</option>
<option>delivered</option>
<option>rejected</option>
</select>

<button onclick="updateStatus()">Update</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const ADMIN_EMAIL="myeswanthreddy321@gmail.com";

const config={
apiKey:"AIzaSyD7fBeJ4cV82_7OaWltZ8DDvEr-Y9B_mZA",
authDomain:"chicken-delivery-app-9e4f6.firebaseapp.com",
projectId:"chicken-delivery-app-9e4f6"
};

firebase.initializeApp(config);
const db=firebase.firestore();
const auth=firebase.auth();

let selectedOrderId=null;
let lastOrderTime=null;
let alertInterval=null;

/* AUTH */
auth.onAuthStateChanged(user=>{
if(!user){login();return;}
if(user.email!==ADMIN_EMAIL){
alert("Not authorized");auth.signOut();
}
});

function login(){
const provider=new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider);
}
function logout(){auth.signOut();}

/* MENU */
function openMenu(){menu.classList.add("open");overlay.style.display="block";}
function closeMenu(){menu.classList.remove("open");overlay.style.display="none";}

/* NAV */
function showDashboard(){dashboardSection.style.display="block";deliverySection.style.display="none";ordersSection.style.display="none";}
function showDelivery(){dashboardSection.style.display="none";deliverySection.style.display="block";ordersSection.style.display="none";}
function showOrders(){dashboardSection.style.display="none";deliverySection.style.display="none";ordersSection.style.display="block";}

/* 🔔 ALERT LOOP */
function startAlert(){
if(alertInterval) return;

alertInterval=setInterval(()=>{
let audio=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
audio.play();

if(navigator.vibrate){
navigator.vibrate([200,100,200]);
}

},2000);
}

function stopAlert(){
clearInterval(alertInterval);
alertInterval=null;
}

/* LOAD ORDERS */
db.collection("orders").orderBy("createdAt","desc").onSnapshot(snap=>{

dashboardList.innerHTML="";
deliveryList.innerHTML="";
ordersList.innerHTML="";

snap.forEach(doc=>{
let o=doc.data();

/* NEW ORDER ALERT */
if(o.createdAt){
let t=o.createdAt.toMillis();
if(lastOrderTime && t>lastOrderTime){
startAlert();
}
if(!lastOrderTime || t>lastOrderTime){
lastOrderTime=t;
}
}

/* CARD */
let html=`
<div class="card">
<div onclick="openOrder('${doc.id}')">
<b>${doc.id.slice(0,6)}</b><br>${o.status}
</div>
<button class="reject" onclick="rejectOrder('${doc.id}')">Reject</button>
</div>
`;

/* FILTERING */
if(o.status==="pending" || o.status==="preparing"){
dashboardList.innerHTML+=html;
}
else if(o.status==="out for delivery"){
deliveryList.innerHTML+=html;
}
else{
ordersList.innerHTML+=html;
}

});
});

/* OPEN ORDER */
function openOrder(id){
selectedOrderId=id;
stopAlert();

db.collection("orders").doc(id).get().then(doc=>{
let o=doc.data();

orderDetails.innerHTML=`
<b>User:</b> ${o.userName}<br>
<b>Items:</b> ${o.items.map(i=>i.name).join(", ")}<br>
<b>Address:</b> ${o.address}<br>
<b>Payment:</b> ${o.payment}
`;

statusSelect.value=o.status;
orderModal.style.display="flex";
});
}

/* UPDATE */
function updateStatus(){
db.collection("orders").doc(selectedOrderId).update({
status:statusSelect.value
});
orderModal.style.display="none";
}

/* REJECT */
function rejectOrder(id){
db.collection("orders").doc(id).update({
status:"rejected"
});
}

/* CLOSE MODAL */
window.onclick=e=>{
if(e.target.classList.contains("modal")){
e.target.style.display="none";
}
};

/* DOM */
const menu=document.getElementById("menu");
const overlay=document.getElementById("overlay");
</script>

</body>
</html>

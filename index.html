<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#111;color:white;padding:15px;display:flex;gap:10px}

/* SIDEBAR */
.menu{position:fixed;left:-260px;top:0;width:260px;height:100%;
background:white;transition:0.3s;z-index:1000;}
.menu.open{left:0}

.menu-item{padding:15px;border-bottom:1px solid #eee;cursor:pointer}
.menu-item:hover{background:#f2f2f2}

#overlay{position:fixed;width:100%;height:100%;
background:rgba(0,0,0,0.4);display:none}

/* CONTENT */
.container{padding:15px}

/* CARD */
.card{
background:white;padding:15px;margin:10px 0;
border-radius:10px;cursor:pointer;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* MODAL */
.modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;justify-content:center;align-items:center;
}
.box{
background:white;padding:20px;border-radius:10px;
width:90%;max-width:400px;
}

/* BUTTON */
button{
padding:10px;border:none;border-radius:6px;
background:#16a34a;color:white;margin-top:5px;cursor:pointer;
}
</style>
</head>

<body>

<header>
<span onclick="openMenu()">☰</span>
Admin Panel
</header>

<div id="overlay" onclick="closeMenu()"></div>

<div id="menu" class="menu">
<div class="menu-item" onclick="showDashboard()">📊 Dashboard</div>
<div class="menu-item" onclick="logout()">🚪 Logout</div>
</div>

<div class="container">
<div id="dashboardSection">
<h3>Orders</h3>
<div id="ordersList"></div>
</div>
</div>

<!-- ORDER MODAL -->
<div id="orderModal" class="modal">
<div class="box">
<h3>Order Details</h3>
<div id="orderDetails"></div>

<select id="statusSelect">
<option>pending</option>
<option>preparing</option>
<option>delivered</option>
</select>

<button onclick="updateStatus()">Update Status</button>
<button onclick="openMap()">Track Delivery</button>
</div>
</div>

<!-- MAP MODAL -->
<div id="mapModal" class="modal">
<div class="box">
<h3>Live Tracking</h3>
<div id="map" style="height:300px;border-radius:10px;"></div>
<button onclick="saveLocation()">Save Location</button>
</div>
</div>

<audio id="alertSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<!-- Google Maps -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDLds9mdWrFd1ap158yji-WzxRatQcYFQA"></script>

<script>
const ADMIN_EMAIL="myeswanthreddy321@gmail.com";

const config={
apiKey:"AIzaSyD7fBeJ4cV82_7OaWltZ8DDvEr-Y9B_mZA",
authDomain:"chicken-delivery-app-9e4f6.firebaseapp.com",
projectId:"chicken-delivery-app-9e4f6"
};

firebase.initializeApp(config);
const db=firebase.firestore();
const auth=firebase.auth();

let lastCount=0;
let selectedOrderId=null;
let map, marker;

/* AUTH */
auth.onAuthStateChanged(user=>{
if(!user){login();return;}
if(user.email!==ADMIN_EMAIL){
alert("Not authorized"); auth.signOut();
}
});

function login(){
const provider=new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider);
}

function logout(){auth.signOut();}

/* MENU */
function openMenu(){menu.classList.add("open");overlay.style.display="block";}
function closeMenu(){menu.classList.remove("open");overlay.style.display="none";}

/* LOAD ORDERS */
db.collection("orders").onSnapshot(snap=>{
ordersList.innerHTML="";

if(lastCount && snap.size>lastCount){
alertSound.play();
alert("New Order!");
}
lastCount=snap.size;

snap.forEach(doc=>{
let o=doc.data();

ordersList.innerHTML+=`
<div class="card" onclick="openOrder('${doc.id}')">
Order: ${doc.id.slice(0,6)}<br>
Status: ${o.status||"pending"}
</div>`;
});
});

/* OPEN ORDER */
function openOrder(id){
selectedOrderId=id;

db.collection("orders").doc(id).get().then(doc=>{
let o=doc.data();

orderDetails.innerHTML=`
<b>Items:</b><br>${o.items.map(i=>i.name).join("<br>")}<br><br>
<b>Address:</b> ${o.address}<br>
<b>Payment:</b> ${o.payment}
`;

statusSelect.value=o.status||"pending";
orderModal.style.display="flex";
});
}

/* UPDATE STATUS */
function updateStatus(){
db.collection("orders").doc(selectedOrderId).update({
status:statusSelect.value
});
orderModal.style.display="none";
}

/* OPEN MAP */
function openMap(){
mapModal.style.display="flex";

setTimeout(()=>{
map = new google.maps.Map(document.getElementById("map"), {
center:{lat:17.3850,lng:78.4867},
zoom:15
});

marker = new google.maps.Marker({
position:{lat:17.3850,lng:78.4867},
map:map,
draggable:true
});
},200);
}

/* SAVE LOCATION */
function saveLocation(){
let pos=marker.getPosition();

db.collection("orders").doc(selectedOrderId).update({
location:{
lat:pos.lat(),
lng:pos.lng()
}
});

alert("Location Updated");
mapModal.style.display="none";
}

/* STOP TRACKING WHEN DELIVERED */
db.collection("orders").onSnapshot(snap=>{
snap.forEach(doc=>{
let o=doc.data();
if(o.status==="delivered"){
db.collection("orders").doc(doc.id).update({
location:null
});
}
});
});

/* CLOSE MODALS */
window.onclick=e=>{
if(e.target.classList.contains("modal")){
e.target.style.display="none";
}
};

const menu=document.getElementById("menu");
const overlay=document.getElementById("overlay");
</script>

</body>
</html>

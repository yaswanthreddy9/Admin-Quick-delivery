<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#111;color:white;padding:15px;display:flex;gap:10px}

/* SIDEBAR */
.menu{
position:fixed;left:-260px;top:0;width:260px;height:100%;
background:white;transition:0.3s;z-index:1000;
}
.menu.open{left:0}

.menu-header{
background:#111;color:white;padding:20px;
}

.menu-item{
padding:15px;border-bottom:1px solid #eee;cursor:pointer;
}

/* OVERLAY */
#overlay{
position:fixed;width:100%;height:100%;
background:rgba(0,0,0,0.4);display:none;
}

/* CONTENT */
.container{padding:15px}

/* CARD */
.card{
background:white;padding:15px;margin:10px 0;
border-radius:10px;cursor:pointer;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* INPUT */
input{
width:100%;padding:10px;margin:5px 0;
border-radius:6px;border:1px solid #ccc;
}

/* BUTTON */
button{
padding:8px;border:none;border-radius:6px;
background:#16a34a;color:white;margin:3px;cursor:pointer;
}
.edit{background:orange}
.delete{background:red}

/* MODAL */
.modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;justify-content:center;align-items:center;
}
.box{
background:white;padding:20px;border-radius:10px;
width:90%;max-width:400px;
}
</style>
</head>

<body>

<header>
<span onclick="openMenu()">☰</span>
Admin Panel
</header>

<div id="overlay" onclick="closeMenu()"></div>

<!-- SIDEBAR -->
<div id="menu" class="menu">
<div class="menu-header">
<h3>Admin</h3>
</div>

<div class="menu-item" onclick="showDashboard()">📊 Dashboard</div>
<div class="menu-item" onclick="showDelivery()">🚚 Delivery</div>
<div class="menu-item" onclick="showItems()">🍗 Items</div>
<div class="menu-item" onclick="logout()">🚪 Logout</div>
</div>

<div class="container">

<!-- DASHBOARD -->
<div id="dashboardSection">
<h3>Live Orders</h3>
<div id="dashboardList"></div>
</div>

<!-- DELIVERY -->
<div id="deliverySection" style="display:none">
<h3>Out for Delivery</h3>
<div id="deliveryList"></div>
</div>

<!-- ITEMS -->
<div id="itemsSection" style="display:none">
<h3>Add / Edit Item</h3>

<input id="nameInput" placeholder="Item Name">
<input id="priceInput" type="number" placeholder="Price">
<input id="imageInput" placeholder="Image URL">

<button onclick="saveItem()">Save Item</button>

<h3>Items</h3>
<div id="itemsList"></div>
</div>

</div>

<!-- ORDER MODAL -->
<div id="orderModal" class="modal">
<div class="box">
<h3>Order Details</h3>
<div id="orderDetails"></div>

<select id="statusSelect">
<option>pending</option>
<option>preparing</option>
<option>out for delivery</option>
<option>delivered</option>
</select>

<button onclick="updateStatus()">Update Status</button>
</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const ADMIN_EMAIL="myeswanthreddy321@gmail.com";

const config={
apiKey:"AIzaSyD7fBeJ4cV82_7OaWltZ8DDvEr-Y9B_mZA",
authDomain:"chicken-delivery-app-9e4f6.firebaseapp.com",
projectId:"chicken-delivery-app-9e4f6"
};

firebase.initializeApp(config);
const db=firebase.firestore();
const auth=firebase.auth();

let selectedOrderId=null;
let editId=null;
let lastOrderTime=null;

/* AUTH */
auth.onAuthStateChanged(user=>{
if(!user){login();return;}
if(user.email!==ADMIN_EMAIL){
alert("Not authorized");auth.signOut();
}
});

function login(){
const provider=new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider);
}
function logout(){auth.signOut();}

/* MENU */
function openMenu(){menu.classList.add("open");overlay.style.display="block";}
function closeMenu(){menu.classList.remove("open");overlay.style.display="none";}

/* NAV */
function showDashboard(){
dashboardSection.style.display="block";
deliverySection.style.display="none";
itemsSection.style.display="none";
closeMenu();
}
function showDelivery(){
dashboardSection.style.display="none";
deliverySection.style.display="block";
itemsSection.style.display="none";
closeMenu();
}
function showItems(){
dashboardSection.style.display="none";
deliverySection.style.display="none";
itemsSection.style.display="block";
closeMenu();
}

/* 🔔 ALERT */
function playAlert(){
const audio=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
audio.play();
alert("New Order!");
}

/* LOAD ORDERS */
db.collection("orders")
.orderBy("createdAt","desc")
.onSnapshot(snap=>{

dashboardList.innerHTML="";
deliveryList.innerHTML="";

snap.forEach(doc=>{
let o=doc.data();

/* ALERT */
if(o.createdAt){
let t=o.createdAt.toMillis();
if(lastOrderTime && t>lastOrderTime){
playAlert();
}
if(!lastOrderTime || t>lastOrderTime){
lastOrderTime=t;
}
}

/* DASHBOARD */
let html=`
<div class="card" onclick="openOrder('${doc.id}')">
<b>Order:</b> ${doc.id.slice(0,6)}<br>
<b>Status:</b> ${o.status}
</div>`;

dashboardList.innerHTML+=html;

/* DELIVERY FILTER */
if(o.status==="out for delivery"){
deliveryList.innerHTML+=html;
}

});
});

/* OPEN ORDER */
function openOrder(id){
selectedOrderId=id;

db.collection("orders").doc(id).get().then(doc=>{
let o=doc.data();

orderDetails.innerHTML=`
<b>User:</b> ${o.userName || "User"}<br>
<b>Items:</b> ${o.items ? o.items.map(i=>i.name).join(", ") : "No items"}
<b>Address:</b> ${o.address}<br>
<b>Payment:</b> ${o.payment}
`;

statusSelect.value=o.status;
orderModal.style.display="flex";
});
}

/* UPDATE STATUS */
function updateStatus(){

let status = statusSelect.value;

db.collection("orders").doc(selectedOrderId).update({
status: status
});

/* START TRACKING */
if(status === "out for delivery"){
startLiveTracking(selectedOrderId);
}

/* STOP TRACKING */
if(status === "delivered" || status === "rejected"){
stopTracking();
}

orderModal.style.display="none";
}

/* ITEMS */
function saveItem(){
let name=nameInput.value;
let price=priceInput.value;
let image=imageInput.value;

if(!name||!price){alert("Fill all fields");return;}

let data={name,price:Number(price),image};

if(editId){
db.collection("items").doc(editId).update(data);
editId=null;
}else{
db.collection("items").add(data);
}

nameInput.value="";
priceInput.value="";
imageInput.value="";
}

/* LOAD ITEMS */
db.collection("items").onSnapshot(snap=>{
itemsList.innerHTML="";

snap.forEach(doc=>{
let i=doc.data();

itemsList.innerHTML+=`
<div class="card">
<b>${i.name}</b> - ₹${i.price}<br>
<img src="${i.image}" width="100%" onerror="this.src='https://via.placeholder.com/150'">
<br>
<button class="edit" onclick="editItem('${doc.id}','${i.name}',${i.price},'${i.image}')">Edit</button>
<button class="delete" onclick="deleteItem('${doc.id}')">Delete</button>
</div>`;
});
});

function editItem(id,n,p,img){
editId=id;
nameInput.value=n;
priceInput.value=p;
imageInput.value=img;
window.scrollTo(0,0);
}
function deleteItem(id){
if(confirm("Delete?")) db.collection("items").doc(id).delete();
}

/* CLOSE MODAL */
window.onclick=e=>{
if(e.target.classList.contains("modal")){
e.target.style.display="none";
}
};

/* DOM */
const menu=document.getElementById("menu");
const overlay=document.getElementById("overlay");

let watchId = null;

function startLiveTracking(orderId){

if(!navigator.geolocation){
alert("GPS not supported");
return;
}

watchId = navigator.geolocation.watchPosition(pos=>{

db.collection("orders").doc(orderId).update({
location:{
lat: pos.coords.latitude,
lng: pos.coords.longitude
}
});

}, err=>{
console.log(err);
},{
enableHighAccuracy:true,
maximumAge:0,
timeout:5000
});

}

function stopTracking(){
if(watchId){
navigator.geolocation.clearWatch(watchId);
watchId = null;
}
}

if(status === "out for delivery"){
startLiveTracking(selectedOrderId);

db.collection("orders").doc(selectedOrderId).update({
location: null
});
}  


</script>

</body>
</html>
